<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>강지명 | Corelink</title>
    <meta name="description" content="Corelink 강지명 · Founder | Content Director. 병원 마케팅, 숏폼 컨텐츠, 방송 출연자 협업." />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="강지명 | Corelink" />
    <meta property="og:description" content="Founder | Content Director" />
    <meta property="og:url" content="https://ji-myung.github.io/corelink-mobile/" />

    <link rel="icon" href="/corelink-mobile/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap"
    />

    <script>
      // 첫 페인트 전에 테마를 적용해 깜빡임을 막는다. 기본값은 dark.
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
